[project]
name = "epiccut-studio"
version = "0.1.0"
description = "Local-first short-form video editor focused on AI-generated cinematic content."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
epiccut = "epiccut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["epiccut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
