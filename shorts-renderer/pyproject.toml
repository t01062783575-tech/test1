[project]
name = "shorts-renderer"
version = "0.1.0"
description = "Local-first FFmpeg rendering service for automated Instagram Reels / YouTube Shorts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shorts-render = "renderer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
